<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile • HackMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a class="brand" href="index.html">
        <span class="brand-logo" aria-hidden="true">⚡</span>
        <span class="brand-name">HackMate</span>
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="find.html">Find</a>
        <a class="nav-link" href="requests.html">Requests</a>
        <a class="button button-secondary" href="profile.html">Profile</a>
        <a class="button button-primary" href="login.html">Logout</a>
      </nav>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <span class="hamburger"></span>
      </button>
    </div>
  </header>

  <main class="profile-page">
    <section class="profile-card">
      <h1>Manage Your Profile</h1>
      <p class="subtitle">Update your information to find better teammate matches.</p>

      <form class="profile-form" id="profile-form">
        <div class="form-group">
          <label for="profile-name">Name</label>
          <input id="profile-name" name="name" type="text" placeholder="Your full name" required />
        </div>

        <div class="form-group">
          <label for="profile-bio">Bio</label>
          <textarea id="profile-bio" name="bio" rows="4" placeholder="Tell us about yourself, your interests, and what you're looking for in a team..." maxlength="500"></textarea>
          <small class="char-count">0/500</small>
        </div>

        <div class="form-group">
          <label for="profile-experience">Experience Level</label>
          <select id="profile-experience" name="experience" required>
            <option value="">Select your level</option>
            <option value="beginner">Beginner (0-1 years)</option>
            <option value="intermediate">Intermediate (1-3 years)</option>
            <option value="advanced">Advanced (3-5 years)</option>
            <option value="expert">Expert (5+ years)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="skill-input">Skills</label>
          <div class="skill-input-container">
            <input id="skill-input" type="text" placeholder="Add a skill (e.g., Python, React)" />
            <button type="button" id="add-skill-btn" class="button button-secondary">Add</button>
          </div>
          <div class="skill-tags" id="skill-tags"></div>
          <small>Click on tags to remove them. Common skills: Python, React, ML, UI/UX, etc.</small>
        </div>

        <button type="submit" class="button button-primary button-large">Save Profile</button>
        <p class="success-message" role="status">Profile saved successfully! (demo only)</p>
      </form>
    </section>
  </main>

  <script src="profile.js"></script>
</body>
</html>
