services:
  - type: web
    name: hackmate-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - { key: ENVIRONMENT, value: production }
      - { key: PYTHON_VERSION, value: "3.12.7" }
      - { key: MONGODB_URI, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: CORS_ORIGINS, sync: false }      # https://your-app.vercel.app
      - { key: FRONTEND_URL, sync: false }      # https://your-app.vercel.app
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_FROM, sync: false }
      - { key: SMTP_USERNAME, sync: false }
      - { key: SMTP_PASSWORD, sync: false }
      - { key: CONTACT_EMAIL, sync: false }
      - { key: OPENALEX_API_KEY, sync: false }
