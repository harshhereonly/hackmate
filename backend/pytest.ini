[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
    # mongomock (test-only dependency) still calls datetime.utcnow() internally.
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning:mongomock
    ignore:the \(type, exc, tb\) signature of throw\(\) is deprecated:DeprecationWarning:mongomock
